name: CI

# Each platform the game ships on is built, tested and packaged on every push
# to main, every pull request and every tag, split into jobs that run side by
# side, so the slowest one sets the time rather than the sum:
#
#   linux-managed     the managed test legs, one job per tier
#                     (make managed-legs-fast, make managed-legs-slow)
#   linux-check       the repo's gate, `make check` (a full debug build, which
#                     the native tests are written against, and every test
#                     leg but the managed ones; the native leg's fast tier)
#   linux-native-slow the native leg's slow tier (make cpp-test-slow)
#   linux-sniper      the shipped native libraries, built inside Valve's
#                     sniper container, and the GLIBC ceiling
#   linux             the clang Release build of the game (no native tests:
#                     linux-check builds and runs them), packaged with
#                     linux-sniper's libraries, which it waits for only at
#                     the package step
#   windows-managed   the managed test projects, one job per tier
#   windows           the MSVC Release build, the native gtests, the package
#
# The tests are split in two tiers (tools/test-tiers.tsv lists the slow ones:
# a managed fact or native test of 2 s or more, a class whose facts add up to
# 20 s), and each tier runs in a job of its own, so the slow facts no longer
# set the time of the jobs that run the many fast ones. Between them the jobs
# still run every test.
#
# A tag also attaches both platforms' archives to the GitHub release (the
# release job), once every job is green.
#
# Linux is set up the public way (`make setup`: the farm links from a clone
# of stock Valve source-sdk-2013 at valve-sdk.lock). The shipped native libraries
# are the sniper container's (gcc 10 and the glibc 2.31 ceiling the engine's
# runtime has); clang builds them too, in Release (linux) and debug
# (linux-check), and that is what the tests run against. Windows builds
# everything itself, with MSVC for the native half. The native tests that read
# the Linux build's instruments (the ELF scans, the CMake graph, fork-based
# probes) are LINUX_ONLY: configure lists them with their reasons.
#
# The tests gate every job, all of them. The few facts that cannot pass on a
# runner (goldens recorded on the owner's machine, facts that read the fork's
# edits, facts that need a Steam game install) skip there, each naming why,
# because SOURCESHARP_CI is set below; on every other machine they run.
#
# No macOS: Valve no longer supports the Source SDK 2013 games on macOS, so
# nothing would run what a macOS job built, and the launcher has no macOS
# build. The osx column of the CMake project stays as code, but CI holds
# nothing to.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The Makefile turns the MSBuild server on (?=, so this wins): right for a
  # developer's shell that builds all day, wrong for a runner, where a server
  # that outlives its step is a hung job.
  DOTNET_CLI_USE_MSBUILD_SERVER: 'false'
  # Facts that cannot pass on a runner (goldens recorded on the owner's
  # machine, facts that read the fork's edits, facts that need a Steam game
  # install) skip, naming why, when this is set: [NotOnCiFact] and
  # [NotOnCiTheory] in the managed tests, SS_SKIP_ON_CI in the native ones
  # (src/test/common/NotOnCiFactAttribute.cs). Nothing else sets it, so
  # everywhere else they run and fail as before.
  SOURCESHARP_CI: '1'

jobs:
  # The managed test legs, one job per tier. They read no native build
  # output, only the CMake graph a configure writes, so the debug tree they
  # read is configured here and not built. linux-check runs every other leg
  # (make check CHECK_MANAGED=0).
  linux-managed:
    name: linux-x64 (managed tests, ${{ matrix.tier }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # Each tier is a gate of its own: a red fast tier must not cancel the
      # slow one, or its failures would go unseen until the next run.
      fail-fast: false
      matrix:
        tier: [fast, slow]
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp and the Valve-text audit ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      # Clones Valve's source-sdk-2013 beside the checkout at valve-sdk.lock and
      # composes farm/<config> and bin/<config> from it.
      - name: Set up (make setup)
        run: make setup

      - name: "Managed: configure the debug tree the tests read"
        run: tools/build/configure debug -DSS_GC_SECTIONS=ON -DSS_COVERAGE=OFF -DSS_SPLIT_DEBUG=ON
      - name: "Test (managed: make managed-legs-${{ matrix.tier }})"
        run: make managed-legs-${{ matrix.tier }}

      # Rule 6 of the farm (tools/setup): a build reads the Valve clone and never
      # writes it. A write means an output was linked where it should have been built.
      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

      - name: Upload test-leg logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-legs-linux-managed-${{ matrix.tier }}
          path: tools/.test-legs
          # The directory's name starts with a dot, which the action skips
          # unless told.
          include-hidden-files: true
          if-no-files-found: ignore

  # The shipped native libraries: the same CMake project inside Valve's sniper
  # SDK container, so they run on the engine's runtime (tools/build/ci-build).
  # Nothing here needs clang, .NET or the host packages: only the farm, which
  # tools/setup composes, and the image. The image is the slow part (about a
  # minute to pull), so its pull starts first and runs while the job sets up.
  linux-sniper:
    name: linux-x64 (sniper build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Read by tools/build/ci-build too, so the image prefetched is the one
      # the build runs.
      SS_CI_IMAGE: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
      # The runner carries podman too; docker is the one whose daemon is up.
      SS_CI_RUNNER: docker
    steps:
      # In the background, so the clone and the setup below run meanwhile; the
      # build waits for it in "The sniper image". A process a step leaves
      # running carries on into the later steps of the job.
      - name: Prefetch the sniper image
        run: |
          nohup bash -c 'docker pull -q "$SS_CI_IMAGE" > "$RUNNER_TEMP/sniper-pull.log" 2>&1; echo $? > "$RUNNER_TEMP/sniper-pull.rc"' > /dev/null 2>&1 &

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: PyYAML (tools/setup reads mods.yaml)
        run: python -m pip install --quiet pyyaml

      # The farm the container builds from, as the Windows job composes its
      # own: no bundled .NET and no Linux Node (--no-provision), neither of
      # which a native build reads; the pristine clone it does read (D3).
      - name: Set up (tools/setup)
        run: python tools/setup --config release --no-provision --valve-sdk ../source-sdk-2013-valve

      - name: The sniper image
        run: |
          waited=0
          until [[ -f "$RUNNER_TEMP/sniper-pull.rc" ]]; do
            sleep 2; waited=$((waited + 2))
            if (( waited > 900 )); then echo "::error::the prefetch is still pulling after 15 minutes"; exit 1; fi
          done
          cat "$RUNNER_TEMP/sniper-pull.log"
          rc="$(cat "$RUNNER_TEMP/sniper-pull.rc")"
          if [[ "$rc" != 0 ]]; then
            echo "::warning::the prefetch failed ($rc); pulling again"
            docker pull "$SS_CI_IMAGE"
          fi
          echo "waited ${waited}s for the prefetch"
          docker image inspect --format '{{.Id}} {{.Created}}' "$SS_CI_IMAGE"

      # One target per step, so a failure names its library, then the whole
      # once, which builds nothing new and runs the GLIBC ceiling check over
      # every output.
      - name: "Sniper (gcc 10): tier1, mathlib"
        run: |
          tools/build/ci-build release tier1
          tools/build/ci-build release mathlib
      - name: "Sniper (gcc 10): libss_particles.so"
        run: tools/build/ci-build release ss_particles
      - name: "Sniper (gcc 10): libss_fwd_server.so"
        run: tools/build/ci-build release ss_fwd_server
      - name: "Sniper (gcc 10): libss_fwd_client.so"
        run: tools/build/ci-build release ss_fwd_client
      - name: "Sniper (gcc 10): libmanaged_host.so"
        run: tools/build/ci-build release sourcesharp
      - name: "Sniper (gcc 10): server.so"
        run: tools/build/ci-build release server_sourcesharp
      - name: "Sniper (gcc 10): client.so"
        run: tools/build/ci-build release client_sourcesharp
      - name: "Sniper (gcc 10): GLIBC ceiling"
        run: tools/build/ci-build release

      # For the linux job's package: the libraries and their split debug info.
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64-sniper
          path: bin/ci-release/linux64
          if-no-files-found: error
          retention-days: 3

      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

  # The clang Release build of the whole game, and the archive: the game
  # directory bin/release with linux-sniper's libraries in it. It runs beside
  # linux-sniper rather than after it, and waits for the libraries only at the
  # package step, by which time linux-sniper (the shorter job) has usually
  # uploaded them.
  linux:
    name: linux-x64 (build, package)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      # The wait below reads this run's artifacts and jobs.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp and the Valve-text audit ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      - name: Set up (make setup)
        run: make setup

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      # The native half, one final target per step, so a failure names its
      # library. The configure is the one `make release NATIVE_TESTS=0` runs
      # (tools/build/buildsourcesharp's options), so the make release below
      # finds the native half built and does not configure it differently.
      # No native tests (SS_BUILD_TESTS=OFF): linux-check builds and runs them
      # in the debug tree, and this tree's copy took six minutes to compile
      # and was never run.
      - name: "Native: configure (clang, release, no tests)"
        run: tools/build/configure release -DSS_GC_SECTIONS=ON -DSS_COVERAGE=OFF -DSS_SPLIT_DEBUG=ON -DSS_BUILD_TESTS=OFF
      # Valve's tier1 and mathlib first, in a step of their own: the libraries
      # below link them (particles most of all), and the first library step
      # would otherwise carry their compile under its own name.
      - name: "Native: tier1, mathlib"
        run: cmake --build --preset release --target tier1 mathlib
      - name: "Native: libss_particles.so"
        run: cmake --build --preset release --target ss_particles
      - name: "Native: libss_fwd_server.so"
        run: cmake --build --preset release --target ss_fwd_server
      - name: "Native: libss_fwd_client.so"
        run: cmake --build --preset release --target ss_fwd_client
      - name: "Native: libmanaged_host.so"
        run: cmake --build --preset release --target sourcesharp
      - name: "Native: server.so"
        run: cmake --build --preset release --target server_sourcesharp
      - name: "Native: client.so"
        run: cmake --build --preset release --target client_sourcesharp

      # The rest, Release: the web UI, the managed assemblies and the launcher
      # (NativeAOT), deployed with the native libraries into the game
      # directory bin/release.
      - name: Build (make release NATIVE_TESTS=0)
        run: make release NATIVE_TESTS=0

      # NATIVE_TESTS=0 reached the configure: the tree registers no test and
      # built no test binary. A build that quietly put the tests back would
      # cost the six minutes this job no longer spends.
      - name: The release tree holds no native tests
        run: |
          grep -q '^SS_BUILD_TESTS:BOOL=OFF$' farm/release/build/CMakeCache.txt \
            || { echo "::error::farm/release/build is configured with the native tests"; exit 1; }
          if [[ -d bin/release/cpptest ]] && ls bin/release/cpptest | grep -q .; then
            echo "::error::bin/release/cpptest holds test binaries"; exit 1
          fi

      # No `needs:` on linux-sniper, so the two jobs run side by side: the
      # libraries are waited for here, where they are first read. An artifact
      # is listed on the run as soon as its job uploads it. If linux-sniper ends
      # without uploading (it failed, or was cancelled), this fails at once
      # rather than at the timeout.
      - name: Wait for linux-sniper's libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for (( waited = 0; waited <= 900; waited += 5 )); do
            if gh api "$api/artifacts" --jq '.artifacts[].name' | grep -qx native-linux-x64-sniper; then
              echo "waited ${waited}s for linux-sniper"; exit 0
            fi
            state="$(gh api "$api/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "linux-x64 (sniper build)") | .status + " " + (.conclusion // "")')"
            case "$state" in
              "completed success"*) ;;   # done; the artifact listing can lag a moment
              completed*) echo "::error::linux-sniper ended ($state) without uploading its libraries"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::linux-sniper's libraries did not appear in 15 minutes"; exit 1

      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64-sniper
          path: bin/ci-release/linux64

      # An artifact does not keep file modes; the libraries ship executable,
      # as the container built them.
      - name: Package
        run: |
          chmod 0755 bin/ci-release/linux64/*.so
          tools/package-release --config release --label "$SS_LABEL" \
            --native bin/ci-release/linux64 --out dist
          ls -la dist

      # The archive unpacks to a game directory whose launcher runs on its
      # own: --help needs no engine and no Steam.
      # Unpacked outside the checkout, which make check's tools/valve-text-audit
      # scans for copied text and binaries: an unpacked archive in it (the
      # bundled .NET runtime, its notices) would be a finding wherever it ran.
      - name: Smoke
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -C "$smoke" -xzf "dist/sourcesharp-$SS_LABEL-linux-x64.tar.gz"
          "$smoke/sourcesharp/source#" --help | sed -n 1p
          for so in server.so client.so libmanaged_host.so libss_particles.so libss_fwd_server.so libss_fwd_client.so libsteam_api.so; do
            test -f "$smoke/sourcesharp/bin/linux64/$so" || { echo "::error::$so is not in the archive"; exit 1; }
          done
          test -L "$smoke/sourcesharp/mods/test/bin"
          test -f "$smoke/sourcesharp/bin/managed/SourceSharp.Server.dll"
          # The host starts the runtime from this; the .pdb and .deps.json
          # files are in the symbols archive only.
          test -f "$smoke/sourcesharp/bin/managed/SourceSharp.Bootstrap.runtimeconfig.json"
          if find "$smoke/sourcesharp/bin/managed" -name '*.pdb' -o -name '*.deps.json' | grep -q .; then
            echo "::error::managed .pdb/.deps.json files are in the game archive"; exit 1
          fi

      # Two artifacts: the game, and its symbols (the native debug info and
      # the managed .pdb/.json files, tools/package-release).
      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-linux-x64
          path: dist/sourcesharp-${{ env.SS_LABEL }}-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-linux-x64-dbg
          path: dist/sourcesharp-${{ env.SS_LABEL }}-linux-x64-dbg.tar.gz
          if-no-files-found: error

      # Rule 6 of the farm (tools/setup): a build reads the Valve clone and never
      # writes it. A write means an output was linked where it should have been built.
      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

  # The repo's gate before a merge to main, `make check`, in a job of its own
  # beside the release build: a full debug build (the build the native tests
  # are written against) and then every test leg but the managed ones, which
  # linux-managed runs (CHECK_MANAGED=0). Of the native leg it runs the fast
  # tier (NATIVE_TIER=fast); linux-native-slow runs the slow one.
  # The non-CI-friendly facts skip (see the top of this file).
  linux-check:
    name: linux-x64 (make check)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp and the Valve-text audit ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      - name: Set up (make setup)
        run: make setup

      - name: Test (make check, the legs linux-managed does not run)
        run: make check CHECK_MANAGED=0 NATIVE_TIER=fast

      # The managed facts that image the built game (tools/mod-image reads
      # bin/debug's server.so). They skip in linux-managed, which builds
      # nothing native (LinuxDebugBuildFactAttribute);
      # make check has built debug here, so they run against it.
      - name: Test (managed facts that read the native build)
        # A filter that matched nothing would pass, so the step also fails
        # unless every one of the five ran and none skipped.
        run: |
          set -o pipefail
          $HOME/.dotnet/dotnet test bin/debug/tests-server/SourceSharp.Server.Tests.dll --nologo --filter "Needs=DebugBuild" | tee "$RUNNER_TEMP/needs-build.log"
          grep -E 'Passed: +5, Skipped: +0, Total: +5' "$RUNNER_TEMP/needs-build.log"

      # Rule 6 of the farm (tools/setup): a build reads the Valve clone and never
      # writes it. A write means an output was linked where it should have been built.
      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

      - name: Upload test-leg logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-legs-linux-check
          path: tools/.test-legs
          # The directory's name starts with a dot, which the action skips
          # unless told.
          include-hidden-files: true
          if-no-files-found: ignore

  # The native leg's slow tier (tools/test-tiers.tsv): the must-not-compile
  # checks, each a compile of its own, and the instruments' self-tests.
  # buildcpptests builds only the tests it is named, so the debug tree is
  # configured and not built, and none of linux-check's build is waited for.
  linux-native-slow:
    name: linux-x64 (native tests, slow)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The instruments the slow tests run ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      # make setup packs the host's NuGet packages when
      # they are missing, and refuses without the host checkout this clones.
      - uses: ./.github/actions/host-packages

      - name: Set up (make setup)
        run: make setup

      - name: "Native: configure the debug tree"
        run: tools/build/configure debug -DSS_GC_SECTIONS=ON -DSS_COVERAGE=OFF -DSS_SPLIT_DEBUG=ON
      - name: "Test (native, slow tier: make cpp-test-slow)"
        run: make cpp-test-slow

      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

      - name: Upload test-leg logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-legs-linux-native-slow
          path: tools/.test-legs
          include-hidden-files: true
          if-no-files-found: ignore

  # The managed test projects, Debug as on Linux, beside the windows job rather
  # than before its native build. The same setup as windows: MSVC for the
  # NativeAOT Debug launcher LauncherTests runs, and the web UI the managed
  # build embeds. One job per tier, as linux-managed.
  windows-managed:
    name: win-x64 (managed tests, ${{ matrix.tier }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tier: [fast, slow]
    defaults:
      run:
        shell: bash
    steps:
      # The tree's files are LF and some facts read them byte for byte; the
      # runner's git would check them out CRLF.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tools (PyYAML for tools/setup, Ninja for the build)
        run: python -m pip install --quiet pyyaml ninja

      # cl, link and the Windows SDK on PATH, as a VS 2022 x64 developer
      # prompt would have them (the presets name `cl`): vcvars64.bat from the
      # newest Visual Studio with the x64 C++ tools, found by vswhere, and
      # every variable it sets or changes carried into the later steps. A
      # step of our own rather than ilammy/msvc-dev-cmd, a Node 20 action
      # the runners now force onto Node 24 with a deprecation warning.
      # vcvars also sets Platform=x64, which MSBuild takes as the solution
      # platform (SourceSharp.slnx has only Any CPU), so every dotnet command
      # below runs under `env -u Platform`.
      - name: MSVC environment (vcvars64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error 'no Visual Studio with the x64 C++ tools'; exit 1 }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { Write-Error "$vcvars failed ($LASTEXITCODE)"; exit 1 }
          $changed = 0
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -ieq 'Path') { $name = 'PATH' }   # cmd spells it Path
              if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $changed++
              }
            }
          }
          Write-Output "vcvars64 from $vs`: $changed variables set"
          if ($changed -eq 0) { Write-Error 'vcvars64 changed nothing'; exit 1 }

      # What the step above left: the compiler the presets name.
      - name: MSVC environment resolves cl
        run: which cl

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The pinned Node tools/get-node fetches on Linux (VERSION there).
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - uses: ./.github/actions/host-packages

      # tools/setup is Python and runs anywhere git and symlinks do; it clones
      # the pristine Valve SDK at valve-sdk.lock that the farm links from.
      # --no-provision: no bundled .NET yet (it is bundled from setup-dotnet's
      # below) and no Linux Node.
      # Both configurations: the build is Release, the tests read Debug's.
      - name: Set up (tools/setup)
        run: |
          for cfg in release debug; do
            python tools/setup --config $cfg --no-provision --valve-sdk ../source-sdk-2013-valve
          done

      # What the farm's links came out as on this platform: a Windows link
      # answers differently to each of these when it was made wrong.
      - name: The farm's links resolve
        run: |
          python - <<'EOF'
          import os
          for p in ("farm/release/src/public/tier0/platform.h", "farm/release/src/sourcesharp/game/shared/ss_platform.h", "farm/release/src/buildsourcesharp", "farm/release/game/mod_sharp/maps", "farm/release/game/mod_sharp/maps/dm_lockdown.bsp"):
              t = os.readlink(p) if os.path.islink(p) else None
              print(f"{p}: lexists={os.path.lexists(p)} islink={os.path.islink(p)} exists={os.path.exists(p)} target={t!r} target_exists={os.path.exists(t) if t else None}")
          EOF
          ls -la farm/release/src/public/tier0 | head -n 5

      # What `make ui CONFIG=release` does, with setup-node's npm.
      - name: Web UI
        working-directory: src/webui
        run: |
          npm ci --no-audit --no-fund
          npm run build --silent

      # The managed tests, Debug as on Linux (TEST_BUILD in the Makefile),
      # from the built assemblies as the Makefile's legs run them.
      # And the Debug launcher, as the Makefile's managed-legs publishes it:
      # LauncherTests runs the real bin/debug/source#.exe.
      - name: Build the tests (Debug)
        run: |
          env -u Platform dotnet build SourceSharp.slnx -v q --nologo -c Debug
          env -u Platform dotnet publish src/launcher/SourceSharp.Launcher.csproj -v q --nologo -c Debug
          ls -la bin/debug/source#*

      # The gate: this job's tier of every managed test project, as the
      # Makefile's managed-legs-<tier> runs them (oracle-managed reads the
      # pristine upstream clone, which only the Linux job provisions):
      # tools/test-tiers names the legs and gives each its filter. Each leg
      # runs whatever the one before it did, and the step fails if any
      # failed. A fact that runs past five minutes is a hang: --blame-hang
      # ends the test host and names the facts that were running, where the
      # step would otherwise sit silent until the job's timeout (one did, for
      # 20 minutes, with nothing in the log; the slowest fact takes about
      # 30 s). Python writes CRLF to a pipe on Windows, hence the tr.
      - name: "Test (managed, server, client, tf2_descent, tf2: ${{ matrix.tier }} tier)"
        env:
          DOTNET: dotnet
          SS_DOTNET_TEST_ARGS: --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
        run: |
          legs="$(python tools/test-tiers legs ${{ matrix.tier }} | tr -d '\r' | grep -v '^native-')"
          [[ -n "$legs" ]] || { echo "::error::tools/test-tiers named no managed legs"; exit 1; }
          rc=0
          for leg in $legs; do
            env -u Platform python tools/test-tiers run "$leg" || rc=1
          done
          exit $rc

      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

  # The MSVC Release build of the whole game, the native gtests and the
  # archive. The managed tests are windows-managed's, side by side with this.
  windows:
    name: win-x64 (build, native tests, package)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # The tree's files are LF and some facts read them byte for byte; the
      # runner's git would check them out CRLF.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tools (PyYAML for tools/setup, Ninja for the build)
        run: python -m pip install --quiet pyyaml ninja

      # cl, link and the Windows SDK on PATH, as a VS 2022 x64 developer
      # prompt would have them (the presets name `cl`): vcvars64.bat from the
      # newest Visual Studio with the x64 C++ tools, found by vswhere, and
      # every variable it sets or changes carried into the later steps. A
      # step of our own rather than ilammy/msvc-dev-cmd, a Node 20 action
      # the runners now force onto Node 24 with a deprecation warning.
      # vcvars also sets Platform=x64, which MSBuild takes as the solution
      # platform (SourceSharp.slnx has only Any CPU), so every dotnet command
      # below runs under `env -u Platform`.
      - name: MSVC environment (vcvars64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error 'no Visual Studio with the x64 C++ tools'; exit 1 }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { Write-Error "$vcvars failed ($LASTEXITCODE)"; exit 1 }
          $changed = 0
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -ieq 'Path') { $name = 'PATH' }   # cmd spells it Path
              if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                $changed++
              }
            }
          }
          Write-Output "vcvars64 from $vs`: $changed variables set"
          if ($changed -eq 0) { Write-Error 'vcvars64 changed nothing'; exit 1 }

      # What the step above left: the compiler the presets name.
      - name: MSVC environment resolves cl
        run: which cl

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The pinned Node tools/get-node fetches on Linux (VERSION there).
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - uses: ./.github/actions/host-packages

      # tools/setup is Python and runs anywhere git and symlinks do; it clones
      # the pristine Valve SDK at valve-sdk.lock that the farm links from.
      # --no-provision: no bundled .NET yet (it is bundled from setup-dotnet's
      # below) and no Linux Node.
      # Both configurations: the build is Release, the tests read Debug's.
      - name: Set up (tools/setup)
        run: |
          for cfg in release debug; do
            python tools/setup --config $cfg --no-provision --valve-sdk ../source-sdk-2013-valve
          done

      # What the farm's links came out as on this platform: a Windows link
      # answers differently to each of these when it was made wrong.
      - name: The farm's links resolve
        run: |
          python - <<'EOF'
          import os
          for p in ("farm/release/src/public/tier0/platform.h", "farm/release/src/sourcesharp/game/shared/ss_platform.h", "farm/release/src/buildsourcesharp", "farm/release/game/mod_sharp/maps", "farm/release/game/mod_sharp/maps/dm_lockdown.bsp"):
              t = os.readlink(p) if os.path.islink(p) else None
              print(f"{p}: lexists={os.path.lexists(p)} islink={os.path.islink(p)} exists={os.path.exists(p)} target={t!r} target_exists={os.path.exists(t) if t else None}")
          EOF
          ls -la farm/release/src/public/tier0 | head -n 5

      # What `make ui CONFIG=release` does, with setup-node's npm.
      - name: Web UI
        working-directory: src/webui
        run: |
          npm ci --no-audit --no-fund
          npm run build --silent

      - name: Managed assemblies (Release)
        run: env -u Platform dotnet build SourceSharp.slnx -v q --nologo -c Release

      # The native half, one final target per step, so a failure names its
      # library. -k 0: every file that fails, not only the first, in one round.
      - name: "Native: configure (MSVC, release)"
        run: cmake --preset windows-release
      - name: "Native: tier1, mathlib"
        run: cmake --build --preset windows-release --target tier1 mathlib -- -k 0
      - name: "Native: ss_particles.dll"
        run: cmake --build --preset windows-release --target ss_particles -- -k 0
      - name: "Native: ss_fwd_server.dll"
        run: cmake --build --preset windows-release --target ss_fwd_server -- -k 0
      - name: "Native: ss_fwd_client.dll"
        run: cmake --build --preset windows-release --target ss_fwd_client -- -k 0
      - name: "Native: managed_host.dll"
        run: cmake --build --preset windows-release --target sourcesharp -- -k 0
      - name: "Native: server.dll"
        run: cmake --build --preset windows-release --target server_sourcesharp -- -k 0
      - name: "Native: client.dll"
        run: cmake --build --preset windows-release --target client_sourcesharp -- -k 0
      # The native tests beside them (bin/release/cpptest; the LINUX_ONLY ones,
      # an ELF scan or a fork, are listed by configure).
      - name: "Native: tests"
        run: |
          cmake --build --preset windows-release -- -k 0
          ls -la bin/release/bin/x64

      # source#, the launcher: NativeAOT for win-x64 (the csproj picks it on
      # Windows), into bin/release/source#.exe.
      - name: Launcher (dotnet publish src/launcher)
        run: |
          env -u Platform dotnet publish src/launcher/SourceSharp.Launcher.csproj -v q --nologo -c Release
          ls -la bin/release/source#*
          ./bin/release/source#.exe --help | sed -n 1p

      # The bundled .NET runtime for this platform, from the SDK setup-dotnet
      # installed (DOTNET_ROOT).
      - name: Bundle the .NET runtime (tools/setup --provision-runtime)
        run: |
          python tools/setup --config release \
            --no-provision --valve-sdk ../source-sdk-2013-valve --provision-runtime --dotnet-root "$DOTNET_ROOT"
          ls bin/release/bin/dotnet/host/fxr

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      - name: Package
        run: |
          python tools/package-release --config release --platform win-x64 --label "$SS_LABEL" --out dist
          ls -la dist

      # Two artifacts: the game, and its symbols (the native debug info and
      # the managed .pdb/.json files, tools/package-release).
      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-win-x64
          path: dist/sourcesharp-${{ env.SS_LABEL }}-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-win-x64-dbg
          path: dist/sourcesharp-${{ env.SS_LABEL }}-win-x64-dbg.zip
          if-no-files-found: error

      # The native gtest suite, as the Linux job's native leg runs it: one
      # ctest test per binary, run in the farm's src/. Facts that cannot pass
      # on a runner skip (SS_SKIP_ON_CI), as on Linux.
      - name: Test (native gtests)
        run: ctest --test-dir farm/release/build-windows -L gtest --output-on-failure -j 4

      - name: The Valve clone is untouched
        run: |
          status="$(git -C ../source-sdk-2013-valve status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into the Valve clone:"
            echo "$status"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-managed, linux-sniper, linux, linux-check, linux-native-slow, windows-managed, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcesharp-*
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
