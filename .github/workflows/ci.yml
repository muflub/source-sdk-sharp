name: CI

# Linux is the platform the game is developed and tested on, so the Linux job
# is the gate: `make check-public`, the whole build plus the public tier of
# test legs (the Makefile's TEST_PUBLIC_LEGS says what that is and why), on a
# tree set up the public way (`make sdk-upstream`: stock Valve source-sdk-2013
# plus patches/source-sdk-2013/). The managed assemblies are the same bytes
# on every platform, so they are built once, there, and the package job
# (also Linux) builds the shipped Linux native libraries inside Valve's
# sniper container and makes the Linux release archive on every run.
#
# Windows and macOS build what is theirs: the native libraries (server,
# client, particles, the managed host) with their own toolchains, from the
# same farm, through the windows-* and osx-* presets. Valve's SDK ships
# prebuilt libraries for Windows and none for macOS, so macOS links with
# dynamic lookup and builds no particles library (cmake/sdk/CMakeLists.txt).
# The release job attaches every platform's archive to the GitHub release
# when a tag is pushed.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The Makefile turns the MSBuild server on (?=, so this wins): right for a
  # developer's shell that builds all day, wrong for a runner, where a server
  # that outlives its step is a hung job.
  DOTNET_CLI_USE_MSBUILD_SERVER: 'false'

jobs:
  linux:
    name: linux (make check-public)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp and the Valve-text audit ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      # Clones Valve's source-sdk-2013 beside the checkout, applies the patch
      # series (a deterministic `git am`; the sha it must land on is pinned in
      # patches/source-sdk-2013/UPSTREAM), composes farm/<config> and
      # bin/<config>, and clones the pristine upstream the oracle tests read.
      - name: Set up (make sdk-upstream)
        run: make sdk-upstream

      # debug build (web UI, managed, launcher, native tests included, with
      # clang 22), then the public tier of test legs: the ones a machine with
      # only the public inputs can be held to (TEST_PUBLIC_LEGS in the
      # Makefile names them and says why the rest are not).
      - name: Build and test (make check-public)
        run: make check-public

      # The rest of `make check`, for the record and not for the verdict: at
      # 0805b2f these legs fail off the owner's machine for machine-recorded
      # float goldens, facts that read the fork's comments, and facts that
      # need a Steam install (the Makefile lists them). The step cannot fail
      # the job; its leg summary is in the log and the logs are uploaded, so
      # the distance to a green `make check` on a runner is measured on every
      # run and a leg that comes good can be moved into the public tier.
      - name: Every other leg (informational, make test-full)
        continue-on-error: true
        run: make test-full

      # Rule 6 of the farm (tools/setup): a build reads ROOT and never writes
      # it. A write means an output was linked where it should have been built.
      - name: ROOT is untouched
        run: |
          status="$(git -C ../source-sdk-2013-upstream status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into ROOT:"
            echo "$status"
            exit 1
          fi

      - name: Upload test-leg logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-legs-linux
          path: tools/.test-legs
          if-no-files-found: ignore

  # The native libraries on the platforms whose toolchains differ from
  # Linux's: the same farm (tools/sdk-upstream and tools/setup are Python and
  # run anywhere git and symlinks do), the same CMake project, the platform's
  # preset. --no-provision --no-valve-sdk: a native-only build needs no
  # bundled .NET, no Node and no oracle clone.
  native:
    name: native (${{ matrix.name }})
    # After package: the managed assemblies are the same bytes on every
    # platform and are built once, there; this job takes them from its
    # artifact and ships them with its own native libraries and launcher.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest, preset: windows-release, bindir: x64 }
          - { name: osx-x64, os: macos-latest, preset: osx-release, bindir: osx64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tools (PyYAML for tools/setup, Ninja for the build)
        run: python -m pip install --quiet pyyaml ninja

      # cl, link and the Windows SDK on PATH, as a VS 2022 x64 developer
      # prompt would have them (the presets name `cl`).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Set up (tools/sdk-upstream, tools/setup)
        run: |
          python tools/sdk-upstream --sdk-dir ../source-sdk-2013-upstream
          python tools/setup --root ../source-sdk-2013-upstream --config release --no-provision --no-valve-sdk

      # What the farm's links came out as on this platform: a Windows link
      # answers differently to each of these when it was made wrong.
      - name: The farm's links resolve
        run: |
          python - <<'EOF'
          import os
          for p in ("farm/release/src/public/tier0/platform.h", "farm/release/src/sourcesharp/game/shared/ss_platform.h", "farm/release/src/buildsourcesharp"):
              t = os.readlink(p) if os.path.islink(p) else None
              print(f"{p}: lexists={os.path.lexists(p)} islink={os.path.islink(p)} exists={os.path.exists(p)} target={t!r} target_exists={os.path.exists(t) if t else None}")
          EOF
          ls -la farm/release/src/public/tier0 | head -n 5

      - name: Configure (cmake --preset ${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: What was built
        run: ls -la bin/release/bin/${{ matrix.bindir }}

      # source#, the launcher: NativeAOT for this platform (the csproj picks
      # win-x64 / osx-x64 from the host), into bin/release/source#[.exe].
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Launcher (dotnet publish src/launcher)
        run: |
          dotnet publish src/launcher/SourceSharp.Launcher.csproj -v q --nologo -c Release
          ls -la bin/release/source#*
          ./bin/release/source#* --help | sed -n 1p

      # The managed assemblies from the Linux build, and the bundled .NET
      # runtime for this platform from the SDK setup-dotnet installed
      # (DOTNET_ROOT): the two pieces of the game directory a native build
      # does not make.
      - uses: actions/download-artifact@v8
        with:
          name: managed-release
          path: bin/release/bin/managed

      - name: Bundle the .NET runtime (tools/setup --provision-runtime)
        run: |
          python tools/setup --root ../source-sdk-2013-upstream --config release \
            --no-provision --no-valve-sdk --provision-runtime --dotnet-root "$DOTNET_ROOT"
          ls bin/release/bin/dotnet/host/fxr

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      - name: Package
        run: |
          python tools/package-release --config release --platform ${{ matrix.name }} --label "$SS_LABEL" --out dist
          ls -la dist

      - name: ROOT is untouched
        run: |
          status="$(git -C ../source-sdk-2013-upstream status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into ROOT:"
            echo "$status"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-${{ matrix.name }}
          path: dist/*

  # The Linux release build, made on every run: the managed assemblies and the
  # launcher in Release, the native libraries inside Valve's sniper SDK
  # container (make ci-build: gcc, and the glibc 2.31 ceiling the engine's
  # runtime has), packaged by tools/package-release into one game directory
  # that runs from wherever it is unpacked. Uploaded as a workflow artifact;
  # the release job attaches it to the GitHub release on a tag.
  package:
    name: package (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      - name: Set up (make sdk-upstream)
        run: make sdk-upstream

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      # What buildsourcesharp does for `make release`, minus its host-clang
      # native build, which the container build below replaces.
      - name: Web UI, managed assemblies and launcher (Release)
        run: |
          make ui CONFIG=release
          ~/.dotnet/dotnet build SourceSharp.slnx -v q --nologo -c Release
          ~/.dotnet/dotnet publish src/launcher/SourceSharp.Launcher.csproj -v q --nologo -c Release

      - name: Native libraries in the sniper container (make ci-build)
        env:
          # The runner carries podman too; docker is the one whose daemon is up.
          SS_CI_RUNNER: docker
        run: make ci-build CONFIG=release

      - name: Package
        run: |
          tools/package-release --config release --label "$SS_LABEL" \
            --native bin/ci-release/linux64 --out dist
          ls -la dist

      # The archive unpacks to a game directory whose launcher runs on its
      # own: --help needs no engine and no Steam.
      - name: Smoke
        run: |
          mkdir -p out/smoke
          tar -C out/smoke -xzf "dist/sourcesharp-$SS_LABEL-linux-x64.tar.gz"
          ./out/smoke/sourcesharp/source# --help | sed -n 1p
          for so in server.so client.so libmanaged_host.so libsteam_api.so; do
            test -f "out/smoke/sourcesharp/bin/linux64/$so" || { echo "::error::$so is not in the archive"; exit 1; }
          done
          test -L out/smoke/sourcesharp/mods/test/bin
          test -f out/smoke/sourcesharp/bin/managed/SourceSharp.Server.dll

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-linux-x64
          path: dist/*

      # For the Windows and macOS jobs (native, below): the same assemblies
      # every platform ships.
      - uses: actions/upload-artifact@v7
        with:
          name: managed-release
          path: bin/release/bin/managed

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, native, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcesharp-*
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
