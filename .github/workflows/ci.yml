name: CI

# Two jobs, one per platform the game ships on, and the same shape on both:
# a full Release build, the tests, and the release archive, on every push to
# main, every pull request and every tag. A tag also attaches both archives
# to the GitHub release (the release job), once both jobs are green.
#
# Linux is set up the public way (`make sdk-upstream`: stock Valve
# source-sdk-2013 plus patches/source-sdk-2013/). `make release` builds
# everything with clang, and that build is what the tests run against; the
# shipped native libraries are built again inside Valve's sniper container
# (make ci-build: gcc 10 and the glibc 2.31 ceiling the engine's runtime
# has). Windows builds everything itself too, with MSVC for the native half,
# and runs the native gtests and the managed test projects. The native tests
# that read the Linux build's instruments (the ELF scans, the CMake graph,
# fork-based probes) are LINUX_ONLY: configure lists them with their reasons.
#
# The tests gate both jobs, all of them. The few facts that cannot pass on a
# runner (goldens recorded on the owner's machine, facts that read the fork's
# edits, facts that need a Steam game install) skip there, each naming why,
# because SOURCESHARP_CI is set below; on every other machine they run.
#
# No macOS: Valve no longer supports the Source SDK 2013 games on macOS, so
# nothing would run what a macOS job built, and the launcher has no macOS
# build. The osx column of the CMake project stays as code, but CI holds
# nothing to.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # The Makefile turns the MSBuild server on (?=, so this wins): right for a
  # developer's shell that builds all day, wrong for a runner, where a server
  # that outlives its step is a hung job.
  DOTNET_CLI_USE_MSBUILD_SERVER: 'false'
  # Facts that cannot pass on a runner (goldens recorded on the owner's
  # machine, facts that read the fork's edits, facts that need a Steam game
  # install) skip, naming why, when this is set: [NotOnCiFact] and
  # [NotOnCiTheory] in the managed tests, SS_SKIP_ON_CI in the native ones
  # (src/test/common/NotOnCiFactAttribute.cs). Nothing else sets it, so
  # everywhere else they run and fail as before.
  SOURCESHARP_CI: '1'

jobs:
  linux:
    name: linux-x64 (build, test, package)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp and the Valve-text audit ask git about the tree.
          fetch-depth: 0

      - uses: ./.github/actions/toolchain-linux
      - uses: ./.github/actions/host-packages

      # Clones Valve's source-sdk-2013 beside the checkout, applies the patch
      # series (a deterministic `git am`; the sha it must land on is pinned in
      # patches/source-sdk-2013/UPSTREAM), composes farm/<config> and
      # bin/<config>, and clones the pristine upstream the oracle tests read.
      - name: Set up (make sdk-upstream)
        run: make sdk-upstream

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      # The managed tests first, before anything native is compiled: they read
      # no native build output, only the CMake graph a configure writes, so
      # the debug tree they read is configured here and not built. make check
      # at the end runs every other leg (CHECK_MANAGED=0).
      - name: "Managed: configure the debug tree the tests read"
        run: tools/build/configure debug -DSS_GC_SECTIONS=ON -DSS_COVERAGE=OFF -DSS_SPLIT_DEBUG=ON
      - name: "Test (managed: make managed-legs)"
        run: make managed-legs

      # The native half, one final target per step, so a failure names
      # its library. The configure is the one `make release` runs
      # (tools/build/buildsourcesharp's options), so the make release below
      # finds the native half built and does not configure it differently.
      - name: "Native: configure (clang, release)"
        run: tools/build/configure release -DSS_GC_SECTIONS=ON -DSS_COVERAGE=OFF -DSS_SPLIT_DEBUG=ON
      - name: "Native: libss_particles.so"
        run: cmake --build --preset release --target ss_particles
      - name: "Native: libmanaged_host.so"
        run: cmake --build --preset release --target sourcesharp
      - name: "Native: server.so"
        run: cmake --build --preset release --target server_sourcesharp
      - name: "Native: client.so"
        run: cmake --build --preset release --target client_sourcesharp
      - name: "Native: tests"
        run: cmake --build --preset release

      # The rest, Release: the web UI, the managed assemblies and the launcher
      # (NativeAOT), deployed with the native libraries into the game
      # directory bin/release.
      - name: Build (make release)
        run: make release

      # The shipped native libraries: the same CMake project inside Valve's
      # sniper SDK container, so they run on the engine's runtime. One target
      # per step, then the whole once, which builds nothing new and runs the
      # GLIBC ceiling check over every output.
      - name: "Sniper (gcc 10): libss_particles.so"
        env: { SS_CI_RUNNER: docker }
        run: make ci-build CONFIG=release TARGET=ss_particles
      - name: "Sniper (gcc 10): libmanaged_host.so"
        env: { SS_CI_RUNNER: docker }
        run: make ci-build CONFIG=release TARGET=sourcesharp
      - name: "Sniper (gcc 10): server.so"
        env: { SS_CI_RUNNER: docker }
        run: make ci-build CONFIG=release TARGET=server_sourcesharp
      - name: "Sniper (gcc 10): client.so"
        env: { SS_CI_RUNNER: docker }
        run: make ci-build CONFIG=release TARGET=client_sourcesharp
      - name: "Sniper (gcc 10): GLIBC ceiling"
        env:
          # The runner carries podman too; docker is the one whose daemon is up.
          SS_CI_RUNNER: docker
        run: make ci-build CONFIG=release

      - name: Package
        run: |
          tools/package-release --config release --label "$SS_LABEL" \
            --native bin/ci-release/linux64 --out dist
          ls -la dist

      # The archive unpacks to a game directory whose launcher runs on its
      # own: --help needs no engine and no Steam.
      - name: Smoke
        run: |
          mkdir -p out/smoke
          tar -C out/smoke -xzf "dist/sourcesharp-$SS_LABEL-linux-x64.tar.gz"
          ./out/smoke/sourcesharp/source# --help | sed -n 1p
          for so in server.so client.so libmanaged_host.so libss_particles.so libsteam_api.so; do
            test -f "out/smoke/sourcesharp/bin/linux64/$so" || { echo "::error::$so is not in the archive"; exit 1; }
          done
          test -L out/smoke/sourcesharp/mods/test/bin
          test -f out/smoke/sourcesharp/bin/managed/SourceSharp.Server.dll

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-linux-x64
          path: dist/*

      # The gate: `make check`, the repo's own gate before a merge to main
      # (a debug build, which the native tests are written against, then
      # every test leg), with the non-CI-friendly facts skipping (see the top
      # of this file).
      - name: Test (make check, the legs not run above)
        run: make check CHECK_MANAGED=0

      # Rule 6 of the farm (tools/setup): a build reads ROOT and never writes
      # it. A write means an output was linked where it should have been built.
      - name: ROOT is untouched
        run: |
          status="$(git -C ../source-sdk-2013-upstream status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into ROOT:"
            echo "$status"
            exit 1
          fi

      - name: Upload test-leg logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-legs-linux
          path: tools/.test-legs
          # The directory's name starts with a dot, which the action skips
          # unless told.
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    name: win-x64 (build, test, package)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # The tree's files are LF and some facts read them byte for byte; the
      # runner's git would check them out CRLF.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tools (PyYAML for tools/setup, Ninja for the build)
        run: python -m pip install --quiet pyyaml ninja

      # cl, link and the Windows SDK on PATH, as a VS 2022 x64 developer
      # prompt would have them (the presets name `cl`).
      # It also exports Platform=x64, which MSBuild takes as the solution
      # platform (SourceSharp.slnx has only Any CPU), so every dotnet command
      # below runs under `env -u Platform`.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The pinned Node tools/get-node fetches on Linux (VERSION there).
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - uses: ./.github/actions/host-packages

      # tools/sdk-upstream and tools/setup are Python and run anywhere git and
      # symlinks do. --no-provision --no-valve-sdk: no bundled .NET yet (it is
      # bundled from setup-dotnet's below), no Linux Node and no oracle clone.
      # Both configurations: the build is Release, the tests read Debug's.
      - name: Set up (tools/sdk-upstream, tools/setup)
        run: |
          python tools/sdk-upstream --sdk-dir ../source-sdk-2013-upstream
          for cfg in release debug; do
            python tools/setup --root ../source-sdk-2013-upstream --config $cfg --no-provision --no-valve-sdk
          done

      # What the farm's links came out as on this platform: a Windows link
      # answers differently to each of these when it was made wrong.
      - name: The farm's links resolve
        run: |
          python - <<'EOF'
          import os
          for p in ("farm/release/src/public/tier0/platform.h", "farm/release/src/sourcesharp/game/shared/ss_platform.h", "farm/release/src/buildsourcesharp", "farm/release/game/mod_sharp/maps", "farm/release/game/mod_sharp/maps/dm_lockdown.bsp"):
              t = os.readlink(p) if os.path.islink(p) else None
              print(f"{p}: lexists={os.path.lexists(p)} islink={os.path.islink(p)} exists={os.path.exists(p)} target={t!r} target_exists={os.path.exists(t) if t else None}")
          EOF
          ls -la farm/release/src/public/tier0 | head -n 5

      # What `make ui CONFIG=release` does, with setup-node's npm.
      - name: Web UI
        working-directory: src/webui
        run: |
          npm ci --no-audit --no-fund
          npm run build --silent

      - name: Managed assemblies (Release)
        run: env -u Platform dotnet build SourceSharp.slnx -v q --nologo -c Release

      # The managed tests, Debug as on Linux (TEST_BUILD in the Makefile),
      # from the built assemblies as the Makefile's legs run them.
      - name: Build the tests (Debug)
        run: env -u Platform dotnet build SourceSharp.slnx -v q --nologo -c Debug

      # The gate: every managed test project, as the Makefile's managed legs
      # run them (oracle-managed reads the pristine upstream clone, which
      # only the Linux job provisions). Each project runs whatever the one
      # before it did, and the step fails if any failed.
      - name: Test (managed, server, client, tf2_descent)
        run: |
          rc=0
          for dll in tests/SourceSharp.Shared.Tests.dll tests-server/SourceSharp.Server.Tests.dll \
                     tests-client/SourceSharp.Client.Tests.dll tf2_descent-tests/TF2.Descent.Tests.dll; do
            env -u Platform dotnet test "bin/debug/$dll" --nologo || rc=1
          done
          exit $rc

      # The native half, one final target per step, so a failure names its
      # library. -k 0: every file that fails, not only the first, in one round.
      - name: "Native: configure (MSVC, release)"
        run: cmake --preset windows-release
      - name: "Native: ss_particles.dll"
        run: cmake --build --preset windows-release --target ss_particles -- -k 0
      - name: "Native: managed_host.dll"
        run: cmake --build --preset windows-release --target sourcesharp -- -k 0
      - name: "Native: server.dll"
        run: cmake --build --preset windows-release --target server_sourcesharp -- -k 0
      - name: "Native: client.dll"
        run: cmake --build --preset windows-release --target client_sourcesharp -- -k 0
      # The native tests beside them (bin/release/cpptest; the LINUX_ONLY ones,
      # an ELF scan or a fork, are listed by configure).
      - name: "Native: tests"
        run: |
          cmake --build --preset windows-release -- -k 0
          ls -la bin/release/bin/x64

      # source#, the launcher: NativeAOT for win-x64 (the csproj picks it on
      # Windows), into bin/release/source#.exe.
      - name: Launcher (dotnet publish src/launcher)
        run: |
          env -u Platform dotnet publish src/launcher/SourceSharp.Launcher.csproj -v q --nologo -c Release
          ls -la bin/release/source#*
          ./bin/release/source#.exe --help | sed -n 1p

      # The bundled .NET runtime for this platform, from the SDK setup-dotnet
      # installed (DOTNET_ROOT).
      - name: Bundle the .NET runtime (tools/setup --provision-runtime)
        run: |
          python tools/setup --root ../source-sdk-2013-upstream --config release \
            --no-provision --no-valve-sdk --provision-runtime --dotnet-root "$DOTNET_ROOT"
          ls bin/release/bin/dotnet/host/fxr

      - name: Label
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="${GITHUB_SHA::7}"; fi
          echo "SS_LABEL=$v" >> "$GITHUB_ENV"

      - name: Package
        run: |
          python tools/package-release --config release --platform win-x64 --label "$SS_LABEL" --out dist
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: sourcesharp-win-x64
          path: dist/*

      # The native gtest suite, as the Linux job's native leg runs it: one
      # ctest test per binary, run in the farm's src/. Facts that cannot pass
      # on a runner skip (SS_SKIP_ON_CI), as on Linux.
      - name: Test (native gtests)
        run: ctest --test-dir farm/release/build-windows -L gtest --output-on-failure -j 4

      - name: ROOT is untouched
        run: |
          status="$(git -C ../source-sdk-2013-upstream status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "::error::the build wrote into ROOT:"
            echo "$status"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcesharp-*
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
