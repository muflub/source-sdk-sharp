name: Host packages
description: >-
  Clone source-sdk-sharp-host beside this checkout and pack the NuGet package
  the TF2Descent rules module restores (SourceSharp.Host.Contracts), where
  src/tf2_descent/Directory.Build.props looks for it.

# Why only Contracts: the Descent server also restores SourceSharp.Host.Sdk
# 2.6.0, the host's 2.x SDK, and the host's public main packs 1.0.0 without
# that API. So CI builds with HOST_SDK=0 (see the Makefile), which leaves the
# server and its facts out and needs only Contracts, which the public host
# does pack. When the host publishes the 2.x SDK, pack it here too and drop
# HOST_SDK=0 from the workflow.
#
# The host's own `make setup` writes roots.props (where the map tools are)
# and restores its whole solution; this does the first by hand and skips the
# second, since packing Contracts restores only what Contracts needs. The map
# tools clone keeps roots.props truthful; nothing here builds against it.
#
# Everything is bash so the one action serves Linux, Windows and macOS. The
# `dotnet` on PATH is used: the Linux jobs put ~/.dotnet there, the others
# actions/setup-dotnet.

inputs:
  host-ref:
    description: The source-sdk-sharp-host branch or tag to pack.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Clone the host and the map tools beside this checkout
      shell: bash
      run: |
        set -euo pipefail
        ws="$(cygpath -u "$GITHUB_WORKSPACE" 2> /dev/null || echo "$GITHUB_WORKSPACE")"
        beside="$(cd "$ws/.." && pwd)"
        git clone -q --depth 1 --branch "${{ inputs.host-ref }}" \
          https://github.com/muflub/source-sdk-sharp-host "$beside/source-sdk-sharp-host"
        git clone -q --depth 1 \
          https://github.com/muflub/source-sdk-sharp-map-tools "$beside/source-sdk-map-tools"
        echo "host: $(git -C "$beside/source-sdk-sharp-host" log --oneline -1)"
        printf '<Project>\n  <PropertyGroup>\n    <MapToolsRoot>%s/</MapToolsRoot>\n  </PropertyGroup>\n</Project>\n' \
          "$beside/source-sdk-map-tools" > "$beside/source-sdk-sharp-host/roots.props"

    - name: Pack SourceSharp.Host.Contracts
      shell: bash
      run: |
        set -euo pipefail
        ws="$(cygpath -u "$GITHUB_WORKSPACE" 2> /dev/null || echo "$GITHUB_WORKSPACE")"
        host="$(cd "$ws/.." && pwd)/source-sdk-sharp-host"
        # The version the rules module pins, so the package restores by that
        # exact number whatever the host's project says.
        contracts="$(sed -n 's:.*<HostContractsVersion>\(.*\)</HostContractsVersion>.*:\1:p' \
          "$ws/src/tf2_descent/Directory.Build.props")"
        [[ -n "$contracts" ]] || { echo "::error::no HostContractsVersion in src/tf2_descent/Directory.Build.props"; exit 1; }
        dotnet pack "$host/src/Host.Contracts/Host.Contracts.csproj" -c Release \
          -o "$host/bin/nupkg" --nologo -v q -p:Version="$contracts"
        ls -la "$host/bin/nupkg"
        test -f "$host/bin/nupkg/SourceSharp.Host.Contracts.$contracts.nupkg"
