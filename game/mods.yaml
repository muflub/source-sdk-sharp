# The mods this launcher can start. Read by source# (src/launcher), by
# Bootstrap (src/host/managed) for the assemblies to load, and by tools/setup
# to lay out bin/<config>/mods/<id>/. Paths are relative to this file as it is
# seen from bin/<config>/mods.yaml, except `content`, which is relative to the
# repo root.
#
# `defaults` holds any of a mod's settings; each mod overrides what it gives.
# Maps merge key by key, and a scalar or a list a mod gives replaces the
# default's (a mod restates a whole list, as tf2_descent does its assemblies).
# `{id}` in a title or a path is the mod's id. The engine has two roles:
# `client` (source# -mod X: the game client and listen server) and
# `dedicated` (source# -mod X -dedicated, and a hosted pod through the
# resolved mod.dedicated.yaml that make mod-image writes).
default_mod: test
defaults:
  title: "{id}"
  game_dir: mods/{id}
  content: game/mod_{id}
  steam_appid: 243750
  managed_dir: bin/managed
  assemblies:
    server: [SourceSharp.Server]
    client: [SourceSharp.Client]
  engine:
    client:
      appid: 243750
      exe: hl2_linux64
      restart_exit_code: 42
      fd_limit: 2048
      # -novid: skip the intro video on a player's launch (the Makefile's
      # RUN_ARGS carry it for dev runs; this is the plain `source#` path).
      args: [-novid]
      env: {}
    dedicated:
      # 244310's install is the engine directory (its bin/linux64 holds the
      # 64-bit *_srv.so); srcds_linux64 itself, and the libraries 244310 lacks,
      # come from 243750 (plan_host_sdk P0(5)).
      appid: 244310
      exe: srcds_linux64
      exe_appid: 243750
      restart_exit_code: 42
      fd_limit: 4096
      # -insecure: a SourceSharp client is always insecure (modded binaries
      # get no VAC), and an insecure client refuses a secure server ("You must
      # restart before you can connect to secure servers", P6's first join).
      args: [-console, -insecure, -nohltv, +tv_enable, "0"]
      env: {}
mods:
  test:
    title: SourceSharp test mod
    # HL2MP is the core itself; its AI binding is a mod assembly beside it
    # (docs/plans/plan_hl2mp_ai.md §1.3), over the generic server binding
    # before it (plan_bots_teams_tf2 C.2). A mod restates the whole list.
    assemblies:
      server: [SourceSharp.Server, SourceSharp.Ai.Server, SourceSharp.Ai.Hl2mp]
      # Bot setup when creating a server (plan_hl2mp_ai §3.5): the profile
      # store and the commands (game-neutral, plan_bots_teams_tf2 C.2) and
      # HL2MP's teams, and the create-server and bot-editor screens.
      client: [SourceSharp.Client, SourceSharp.Ai.Client, SourceSharp.Ai.Hl2mp.Client]
      client_ui: [SourceSharp.Ai.Ui, SourceSharp.Ai.Hl2mp.Ui]
  # Stock TF2 logic ported to SourceSharp, on TF2's content.
  tf2:
    title: TF2
    # Stock's TF2 English, read through the engine's GAME paths (they ride in
    # a VPK, where no disk path reaches): the notice and class tokens the
    # server names in chat lines (#game_respawn_as and its #TF_Class_Name_*)
    # live here, and no table this client loads into the engine holds them —
    # the chat, TextMsg and the panels read them from this one chain.
    localisation: [resource/tf_english.txt, resource/tf_items_english.txt]
    # TF2 ships its weapon scripts sealed: ReadEncryptedKVFile
    # (weapon_parse.cpp:202-267) reads scripts/<name>.txt first and, with the
    # key g_pGameRules->GetEncryptionKey() hands it — TF2's literal
    # "E2NcUkG2" (tf_gamerules.h GetTFEncryptionKey) — the ICE-decrypted
    # scripts/<name>.ctx. Shipped content carries only the .ctx form, so the
    # core's weapon-script readers get the key from this row (the client's
    # print-name lookups and the server's precache reach the GAME paths; the
    # TF side reaches the same content through TFEncryption.Key).
    encryption_key: E2NcUkG2
    # TF2's AI binding (plan_bots_teams_tf2 C.2) over the generic server
    # binding before it, as the test mod lists HL2MP's. SourceSharp.Ai.Store
    # is the bots' experience database (Part G, G.3): TF2's bots keep one,
    # HL2MP's do not, so only this list names it. Its client side is bot
    # setup (P6 step 8): the game-neutral profile store and models, TF2's
    # teams, classes and names, the bots page and the editor.
    assemblies:
      server: [SourceSharp.Server, TF2.Server, SourceSharp.Ai.Store, SourceSharp.Ai.Server, SourceSharp.Ai.TF2]
      client: [SourceSharp.Client, TF2.Client, SourceSharp.Ai.Client, SourceSharp.Ai.TF2.Client]
      client_ui: [TF2.Client.Ui, SourceSharp.Ai.Ui, SourceSharp.Ai.TF2.Ui]
  # TF2Descent builds on the TF2 mod: its assemblies load after TF2's.
  tf2_descent:
    title: TF2Descent
    # TF2's sealed weapon scripts, as the tf2 row: a mod inherits only the
    # defaults, and this one runs TF2's assemblies over TF2's content.
    encryption_key: E2NcUkG2
    # TF2's strings, as the tf2 row reads them (stock's chat and panel tokens),
    # and the TF2 mod's own UI strings (resource/tf2_english.txt, on the GAME
    # path through ../tf2): a hero's HUD and menus are TF2's.
    localisation: [resource/tf2_english.txt, resource/tf_english.txt, resource/tf_items_english.txt]
    # TF2's HUD and menus (ammo, crosshair, the class menu, the kill feed),
    # then the Descent screens over the sources TF2.Descent.Client registers
    # (plan UI1): the Descent HUD takes TF2's health corner for its life orb.
    # No SourceSharp.Ai assembly: Descent loads no TF2 bots.
    assemblies:
      server: [SourceSharp.Server, TF2.Server, TF2.Descent.Server]
      client: [SourceSharp.Client, TF2.Client, TF2.Descent.Client]
      client_ui: [TF2.Client.Ui, TF2.Descent.Client.Ui]
    # The hosted server-browser entry (host plan_steam_auth S-18): source#
    # -resolve -dedicated writes it into mod.dedicated.yaml, and the game
    # server hands it to the host SDK before Booting. name, description,
    # tags, map and the rules' values are templates over the keys the host
    # publishes: {hub_map} {players} {max_players} {levels_open} {deepest}
    # {players_by_level} {pool_ready}; any other key is refused. region is
    # Steam's region string ("" is Steam's default); max_players 0 is the
    # host's capacity; an empty map is {hub_map}.
    browser:
      name: "TF2 Descent ({levels_open} levels open)"
      description: "TF2 Descent"
      tags: "rpg,coop,descent,deepest{deepest}"
      region: ""
      max_players: 0
      map: "depth {deepest}"
      rules:
        players_by_level: "{players_by_level}"
        pool_ready: "{pool_ready}"
