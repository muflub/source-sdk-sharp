// The default binds the engine execs when a player's config.cfg is missing
// (the engine execs config_default.cfg from //MOD/cfg/, and the install's own
// tf/cfg/config_default.cfg is mounted as GAME, not MOD, so it is never
// found). Keys are stock TF2's: movement, weapons, the scoreboard, chat and
// voice, the console, and the commands the TF2 menus and HUD name by token
// (%lastinv% in the build menu's cancel hint, the spectator key hints, the
// disguise menu).
unbindall
bind "`" "toggleconsole"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "TAB" "+showscores"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+attack3"
bind "r" "+reload"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "q" "lastinv"
bind "F5" "screenshot"
bind "PAUSE" "pause"
bind "ESCAPE" "escape"
bind "y" "say"
bind "u" "say_team"
bind "v" "+voicerecord"
bind "," "changeclass"
bind "." "changeteam"
bind "-" "disguiseteam"
bind "b" "lastdisguise"
bind "i" "showmapinfo"
