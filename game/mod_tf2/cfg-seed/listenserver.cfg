// The TF2 mod's listen-server settings, seeded into cfg/ when absent: a
// listen server runs this (lservercfgfile) where a dedicated one runs server.cfg.
// Stock TF2 waits 30 s for players before its first round (tf_gamerules.cpp
// declares mp_waitingforplayers_time "30"); the core declares HL2's 0.
mp_waitingforplayers_time 30
