// TF2Descent's server settings, seeded into cfg/ when absent (plan_host_sdk §2.7).

// Keep thinking with no players: a hosted server's frames carry the host SDK's
// liveness stamp, and a hub that stops thinking is reaped as hung (R1, P0(1)).
sv_hibernate_think 1

// Clients fetch generated levels from the host's fastdl listener; the pod
// passes the URL (+sv_downloadurl) when the service has one.
sv_allowdownload 1
